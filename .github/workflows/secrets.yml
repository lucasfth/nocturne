name: secrets
on: [push, pull_request]
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks (pinned, checksum-verified)
        run: |
          curl -fsSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c
          tar -xzf gl.tgz gitleaks
          ./gitleaks git --redact --no-banner --config .gitleaks.toml
      - name: no runtime files tracked
        run: |
          if git ls-files | grep -E '(^|/)(data/|config\.json$)|\.(sqlite|db|key|pem|secret)$'; then echo "runtime/secret file tracked"; exit 1; fi
